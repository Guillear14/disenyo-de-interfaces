<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuleta Examen WPF & C# — Diseño de Interfaces</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-header: #111827;
            --bg-card: #161f30;
            --bg-code: #090d14;
            --border: #26334d;
            --border-hover: #3b82f6;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-soft: rgba(59, 130, 246, 0.15);
            --xaml-badge: #f59e0b;
            --cs-badge: #10b981;
            --origin-badge: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 13px;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.4;
        }

        /* CABECERA STICKY COMPACTA PARA 720P / PANTALLA DIVIDIDA */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(17, 24, 39, 0.96);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
        }

        .brand span.tag {
            background: var(--accent-soft);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.35);
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 99px;
        }

        .search-wrap {
            flex: 1;
            min-width: 220px;
            max-width: 480px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            background: #0b0f17;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 5px 28px 5px 10px;
            border-radius: 6px;
            font-size: 12.5px;
            outline: none;
            transition: border-color 0.15s;
        }

        #searchInput:focus {
            border-color: var(--accent);
        }

        .clear-btn {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            display: none;
        }

        /* BARRA DE FILTROS DE CATEGORÍA */
        .filters {
            display: flex;
            align-items: center;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .filter-btn {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.12s;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: #475569;
        }

        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .filter-btn .count {
            background: rgba(0, 0, 0, 0.3);
            padding: 0 5px;
            border-radius: 8px;
            font-size: 10.5px;
        }

        /* GRID DE TARJETAS */
        main {
            padding: 10px 14px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(490px, 1fr));
            gap: 10px;
        }

        @media (max-width: 560px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.15s;
        }

        .card:hover {
            border-color: #3b4f73;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .card-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #fff;
        }

        .card-desc {
            font-size: 11.8px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badges {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .badge {
            font-size: 10.5px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-cat {
            background: rgba(59, 130, 246, 0.16);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-origin {
            background: rgba(139, 92, 246, 0.16);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* BLOQUES DE CÓDIGO XAML + C# */
        .code-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .code-box {
            background: var(--bg-code);
            border: 1px solid #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }

        .code-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 8px;
            background: #111827;
            border-bottom: 1px solid #1e293b;
            font-size: 11px;
            font-weight: 700;
        }

        .lang-xaml { color: var(--xaml-badge); }
        .lang-cs { color: var(--cs-badge); }

        .copy-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.12s;
        }

        .copy-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .copy-btn.copied {
            background: #059669;
            border-color: #059669;
            color: #fff;
        }

        pre {
            margin: 0;
            padding: 7px 9px;
            overflow-x: auto;
            max-height: 210px;
            font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
            font-size: 11.5px;
            line-height: 1.38;
            color: #e2e8f0;
            tab-size: 4;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 36px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <div class="top-row">
        <div class="brand">
            <span>⚡ CHULETA EXAMEN WPF (.NET)</span>
            <span class="tag">100% Tus Proyectos + Plantilla Base</span>
        </div>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Buscar control, evento, SQLite, PackIcon, RotateTransform, ShowDialog... (Ctrl+K)" autocomplete="off">
            <button class="clear-btn" id="clearBtn" title="Limpiar búsqueda">✕</button>
        </div>
    </div>
    <div class="filters" id="filterBar">
        <button class="filter-btn active" data-cat="todos">📁 Todos <span class="count" id="cnt-todos">0</span></button>
        <button class="filter-btn" data-cat="Estilos/Temas">🎨 Estilos/Temas <span class="count" id="cnt-Estilos/Temas">0</span></button>
        <button class="filter-btn" data-cat="Controles XAML">🧩 Controles XAML <span class="count" id="cnt-Controles XAML">0</span></button>
        <button class="filter-btn" data-cat="Tablas/Bindings">📊 Tablas/Bindings <span class="count" id="cnt-Tablas/Bindings">0</span></button>
        <button class="filter-btn" data-cat="Ventanas/Diálogos">🪟 Ventanas/Diálogos <span class="count" id="cnt-Ventanas/Diálogos">0</span></button>
        <button class="filter-btn" data-cat="Lógica C#">⚙️ Lógica C# <span class="count" id="cnt-Lógica C#">0</span></button>
    </div>
</header>

<main id="cardsGrid"></main>

<script>

let activeCategory = "todos";
let searchQuery = "";

const grid = document.getElementById("cardsGrid");
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
const filterBtns = document.querySelectorAll(".filter-btn");

function escapeHtml(str) {
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function updateCounts() {
    const categories = ["Estilos/Temas", "Controles XAML", "Tablas/Bindings", "Ventanas/Diálogos", "Lógica C#"];
    document.getElementById("cnt-todos").textContent = SNIPPETS.length;
    categories.forEach(cat => {
        const el = document.getElementById("cnt-" + cat);
        if (el) {
            el.textContent = SNIPPETS.filter(s => s.category === cat).length;
        }
    });
}

function renderCards() {
    const q = searchQuery.trim().toLowerCase();
    const filtered = SNIPPETS.filter(item => {
        const matchesCat = activeCategory === "todos" || item.category === activeCategory;
        if (!matchesCat) return false;
        if (!q) return true;
        const haystack = `${item.title} ${item.desc} ${item.origin} ${item.keywords} ${item.xaml} ${item.cs}`.toLowerCase();
        return q.split(/\s+/).every(word => haystack.includes(word));
    });

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No se encontraron bloques para "<b>${escapeHtml(searchQuery)}</b>". Prueba con otra palabra clave.</div>`;
        return;
    }

    grid.innerHTML = filtered.map((item, idx) => `
        <article class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    <div class="card-desc">${escapeHtml(item.desc)}</div>
                </div>
                <div class="badges">
                    <span class="badge badge-cat">${escapeHtml(item.category)}</span>
                    <span class="badge badge-origin">📁 ${escapeHtml(item.origin)}</span>
                </div>
            </div>
            <div class="code-section">
                <div class="code-box">
                    <div class="code-bar">
                        <span class="lang-xaml">◆ XAML</span>
                        <button class="copy-btn" data-type="xaml" data-idx="${SNIPPETS.indexOf(item)}">📋 Copiar XAML</button>
                    </div>
                    <pre><code>${escapeHtml(item.xaml)}</code></pre>
                </div>
                <div class="code-box">
                    <div class="code-bar">
                        <span class="lang-cs">● C# / Config</span>
                        <button class="copy-btn" data-type="cs" data-idx="${SNIPPETS.indexOf(item)}">📋 Copiar C#</button>
                    </div>
                    <pre><code>${escapeHtml(item.cs)}</code></pre>
                </div>
            </div>
        </article>
    `).join("");
}

grid.addEventListener("click", async (e) => {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;
    const idx = parseInt(btn.getAttribute("data-idx"), 10);
    const type = btn.getAttribute("data-type");
    const text = type === "xaml" ? SNIPPETS[idx].xaml : SNIPPETS[idx].cs;

    try {
        await navigator.clipboard.writeText(text);
    } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
    }

    const original = btn.textContent;
    btn.textContent = "✓ ¡Copiado!";
    btn.classList.add("copied");
    setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove("copied");
    }, 1200);
});

filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.getAttribute("data-cat");
        renderCards();
    });
});

searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    clearBtn.style.display = searchQuery ? "block" : "none";
    renderCards();
});

clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    searchQuery = "";
    clearBtn.style.display = "none";
    searchInput.focus();
    renderCards();
});

window.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
    }
});

updateCounts();
renderCards();
</script>
</body>
</html>
